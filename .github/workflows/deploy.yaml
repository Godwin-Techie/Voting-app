name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: # allows manual run from Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Run tests
      - name: Run tests
        run: |
          echo "Run your unit tests here"
          # e.g., pytest or npm test

      # 3. Security scan with Trivy
      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0

      # 4. Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and push all images with docker-compose
      - name: Build and push with Docker Compose
        run: |
          docker compose build
          docker compose push

      # 6. Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      # 7. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 8. Set AKS context
      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: GodwinRG
          cluster-name: device-aks-cluster

      # 9. Install Helm
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # 10. Deploy with Helm
      - name: Deploy with Helm
        run: |
          helm upgrade --install vote ./helm/vote \
            --set global.image.tag=${{ github.sha }}

      # 11. Verify pods and services
      - name: Verify pods and services
        run: |
          kubectl get pods
          kubectl get svc
